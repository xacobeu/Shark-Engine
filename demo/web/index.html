<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkEngine Web Demo</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --accent: #a855f7;
            --accent-hover: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 2rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
        }

        /* Header design */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        #status {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
            background: rgba(168, 85, 247, 0.15);
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(168, 85, 247, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
        }

        /* Demo Canvas Area */
        .canvas-container {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            border-radius: 12px;
            max-width: 100%;
            aspect-ratio: 960/640;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            cursor: crosshair;
        }

        /* Logs Console Panel */
        .console-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .console-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .console-dot {
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: transparent;
            border: none;
            color: #10b981;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            resize: none;
            outline: none;
            line-height: 1.4;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand">
                <div class="logo-icon">S</div>
                <h1>SharkEngine <span style="font-weight: 300; font-size: 1.1rem; opacity: 0.8;">Web Demo</span></h1>
            </div>
            <div id="status">Running</div>
        </header>

        <main class="canvas-container">
            <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        </main>

        <section class="console-panel">
            <div class="console-header">
                <div class="console-dot"></div>
                Engine Console Logs
            </div>
            <textarea id="output" readonly></textarea>
        </section>

        <footer>
            Built with C++20, WebGL 2, and Emscripten. Powered by <a href="https://github.com/xacobeu/SharkEngine" target="_blank">SharkEngine</a>.
        </footer>
    </div>

    <script type="text/javascript">
        var statusElement = document.getElementById('status');
        var outputElement = document.getElementById('output');

        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                if (outputElement) outputElement.value = ''; // Clear initial value
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (outputElement) {
                        outputElement.value += text + "\n";
                        outputElement.scrollTop = outputElement.scrollHeight; // Scroll to bottom
                    }
                };
            })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                // Prevent right click menu on the canvas
                canvas.addEventListener("contextmenu", function(e) { e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return; // Limit updates frequency
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                if (statusElement) {
                    statusElement.innerHTML = text || 'Running';
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        Module.setStatus('Loading WebGL 2 Context...');
        window.onerror = function(event) {
            Module.setStatus('Initialization Failure');
            statusElement.style.color = '#f87171';
            statusElement.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            statusElement.style.background = 'rgba(239, 68, 68, 0.1)';
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
