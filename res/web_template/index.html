<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkEngine Web Demo</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            border: none;
            cursor: crosshair;
            touch-action: none;
        }

        #errors {
            display: none;
            position: fixed;
            inset: 0;
            overflow: auto;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.85);
            color: #fca5a5;
            font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>

<body>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div id="errors" title="Tap to close" onclick="this.style.display = 'none'"></div>

    <script type="text/javascript">
        function showError(text) {
            var box = document.getElementById('errors');
            if (box.style.display !== 'block') {
                box.style.display = 'block';
                box.textContent = 'SharkEngine failed to start\n\n' +
                    navigator.userAgent + '\n' +
                    'crossOriginIsolated: ' + window.crossOriginIsolated +
                    ', SharedArrayBuffer: ' + (typeof SharedArrayBuffer !== 'undefined') +
                    ', cores: ' + navigator.hardwareConcurrency +
                    ', WebGL2: ' + !!document.createElement('canvas').getContext('webgl2') + '\n\n';
            }
            box.textContent += text + '\n';
        }
        if (!document.exitPointerLock) {
            document.exitPointerLock = function () { };
        }
        if (!HTMLCanvasElement.prototype.requestPointerLock) {
            HTMLCanvasElement.prototype.requestPointerLock = function () { };
        }

        (function () {
            var PIXELS_PER_STEP = 12;
            var lastDistance = 0;
            var pending = 0;

            function distance(touches) {
                return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
            }

            window.addEventListener('touchstart', function (e) {
                if (e.touches.length === 2) {
                    lastDistance = distance(e.touches);
                    pending = 0;
                }
            }, { capture: true, passive: true });

            window.addEventListener('touchmove', function (e) {
                if (e.touches.length !== 2 || e.target !== Module.canvas) return;
                e.preventDefault();
                e.stopImmediatePropagation();

                var d = distance(e.touches);
                pending += d - lastDistance;
                lastDistance = d;
                var steps = Math.trunc(pending / PIXELS_PER_STEP);
                if (steps !== 0) {
                    pending -= steps * PIXELS_PER_STEP;
                    Module.canvas.dispatchEvent(new WheelEvent('wheel', {
                        deltaY: -100 * steps,
                        deltaMode: WheelEvent.DOM_DELTA_PIXEL,
                        clientX: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        clientY: (e.touches[0].clientY + e.touches[1].clientY) / 2,
                        bubbles: true,
                        cancelable: true,
                    }));
                }
            }, { capture: true, passive: false });
        })();

        window.addEventListener('unhandledrejection', function (e) {
            var r = e.reason;
            showError('Unhandled promise rejection: ' + (r && (r.stack || r.message) || r));
        });

        var Module = {
            preRun: [],
            postRun: [],
            print: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            },
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                if (/error|abort|exception|fail|out of memory|unreachable|not supported/i.test(text)) showError(text);
            },
            onAbort: function (what) {
                showError('Aborted: ' + what);
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                // Prevent right click menu on the canvas
                canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                console.log("Status: " + text);
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
            }
        };

        Module.setStatus('Loading WebGL 2 Context...');
        window.onerror = function (event, source, line, col, error) {
            console.error(event);
            showError((error && error.stack) || (event + (source ? ' (' + source + ':' + line + ':' + col + ')' : '')));
        };

        let emrunExitSent = false;
        function notifyEmrunExit() {
            if (emrunExitSent) {
                return;
            }
            emrunExitSent = true;
            try {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(window.location.href, '^exit^0');
                } else {
                    fetch(window.location.href, { method: 'POST', body: '^exit^0', keepalive: true });
                }
            } catch (e) { }
        }
        window.addEventListener('pagehide', notifyEmrunExit);
    </script>
    {{{ SCRIPT }}}
</body>

</html>
