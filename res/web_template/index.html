<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkEngine Web Demo</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            border: none;
            cursor: crosshair;
        }

        /* On-screen error log, so failures are visible on phones without devtools. */
        #errors {
            display: none;
            position: fixed;
            inset: 0;
            overflow: auto;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.85);
            color: #fca5a5;
            font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>

<body>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div id="errors" title="Tap to close" onclick="this.style.display = 'none'"></div>

    <script type="text/javascript">
        // Show errors on top of the canvas (first one also prints browser/environment info).
        function showError(text) {
            var box = document.getElementById('errors');
            if (box.style.display !== 'block') {
                box.style.display = 'block';
                box.textContent = 'SharkEngine failed to start\n\n' +
                    navigator.userAgent + '\n' +
                    'crossOriginIsolated: ' + window.crossOriginIsolated +
                    ', SharedArrayBuffer: ' + (typeof SharedArrayBuffer !== 'undefined') +
                    ', cores: ' + navigator.hardwareConcurrency +
                    ', WebGL2: ' + !!document.createElement('canvas').getContext('webgl2') + '\n\n';
            }
            box.textContent += text + '\n';
        }
        window.addEventListener('unhandledrejection', function (e) {
            var r = e.reason;
            showError('Unhandled promise rejection: ' + (r && (r.stack || r.message) || r));
        });

        var Module = {
            preRun: [],
            postRun: [],
            print: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            },
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                // stderr also carries harmless warnings; only surface what looks fatal.
                if (/error|abort|exception|fail|out of memory|unreachable|not supported/i.test(text)) showError(text);
            },
            onAbort: function (what) {
                showError('Aborted: ' + what);
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                // Prevent right click menu on the canvas
                canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                console.log("Status: " + text);
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
            }
        };

        Module.setStatus('Loading WebGL 2 Context...');
        window.onerror = function (event, source, line, col, error) {
            console.error(event);
            showError((error && error.stack) || (event + (source ? ' (' + source + ':' + line + ':' + col + ')' : '')));
        };

        let emrunExitSent = false;
        function notifyEmrunExit() {
            if (emrunExitSent) {
                return;
            }
            emrunExitSent = true;
            try {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(window.location.href, '^exit^0');
                } else {
                    fetch(window.location.href, { method: 'POST', body: '^exit^0', keepalive: true });
                }
            } catch (e) {}
        }
        window.addEventListener('pagehide', notifyEmrunExit);
    </script>
    {{{ SCRIPT }}}
</body>

</html>
