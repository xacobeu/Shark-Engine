name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang \
            libtbb-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Build Desktop Target
        run: cmake --workflow --preset desktop

      - name: Package Linux Binary
        run: |
          tar -czvf SharkEngine-linux-x86_64.tar.gz -C build/desktop-dev/example SharkEngineExample res

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: SharkEngine-linux-x86_64.tar.gz

  build-web:
    name: Build Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip

      - name: Setup Emscripten (emsdk)
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Build Web Target
        run: cmake --workflow --preset web

      - name: Package Web Demo
        run: |
          cd build/web-release/example
          zip -r ../../../SharkEngine-web.zip *

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: SharkEngine-web.zip

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            SharkEngine-linux-x86_64.tar.gz
            SharkEngine-web.zip
